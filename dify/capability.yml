          \ and s(i.get(\"quote\"),600) in raw and s(i.get(\"label\"),80):\n     \
          \       interests.append({\"label\":s(i[\"label\"],80),\"quote\":s(i[\"\
          quote\"],600)})\n    qs=data.get(\"questions\",[])\n    qs=[s(q,220) for\
