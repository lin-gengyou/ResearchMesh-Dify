          ]\n    who_labels={\"personal\":\"本人工作（待本人确认）\",\"team\":\"团队成果（不能归为本人能力）\"\
          ,\"unknown\":\"本人贡献待确认\"}\n    ind_labels={\"independent\":\"原文自述独立完成\"\
          ,\"guided\":\"跟随教程或指导完成\",\"unknown\":\"独立程度未说明\"}\n    for c in claims:\n\
          \        lines += [\"\",\"### \"+safe(c[\"skill_label\"]),safe(c[\"claim_scope\"\
          ]),\n           \"归属：\"+who_labels[c[\"attribution\"]]+\"；\"+ind_labels[c[\"\
          independence\"]]+\"。\",\n           \"原文：“\"+safe(c[\"quote\"])+\"”\",\n\
          \           \"材料：\"+{\"self_reported\":\"经历自述，未外部核验\",\"provided_excerpt\"\
          :\"用户提供的片段，真实性和贡献范围未核验\",\"link_only\":\"仅有链接，本流程未读取链接内容\"}[c[\"support_type\"\
          ]]]\n        if c[\"uncertainties\"]: lines.append(\"待核对：\"+\"；\".join(safe(x)\
          \ for x in c[\"uncertainties\"]))\n    if not claims: lines+=[\"\",\"目前还不能形成具体能力声明。可以先说一次你参与过的小事，不必写完整简历。\"\
          ]\n    if interests: lines+=[\"\",\"### 想学习的方向（不计入现有能力）\"]+[safe(x[\"label\"\
          ])+\"；原文：“\"+safe(x[\"quote\"])+\"”\" for x in interests]\n    if qs: lines+=[\"\
          \",\"### 最多补充两点（知道多少写多少）\"]+[str(i+1)+\". \"+safe(q) for i,q in enumerate(qs)]\n\
          \    if warnings: lines+=[\"\",\"校验提示：\"+\"；\".join(dict.fromkeys(warnings))]\n\
