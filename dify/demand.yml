    - data:
        code: "import json\nimport re\n\nKEYS = [\"onboarding_owner\", \"input_materials\"\
          , \"dependencies\", \"execution_readiness\"]\n\ndef main(arg1: str):\n \
          \   try:\n        p = json.loads(arg1)\n        if not isinstance(p, dict)\
          \ or not isinstance(p.get(\"fields\"), dict): raise ValueError()\n    except\
          \ Exception:\n        return {\"payload\":json.dumps({\"status\":\"validation_error\"\
          },ensure_ascii=False)}\n    if p.get(\"status\") == \"validation_error\"\
          : return {\"payload\":json.dumps(p,ensure_ascii=False)}\n    fields = p[\"\
          fields\"]\n    def known(k):\n        f = fields.get(k,{})\n        return\
          \ isinstance(f,dict) and f.get(\"status\")==\"explicit\" and isinstance(f.get(\"\
          value\"),str) and bool(f[\"value\"].strip()) and isinstance(f.get(\"quote\"\
          ),str) and bool(f[\"quote\"].strip()) and f.get(\"verification\")==\"user_statement_only\"\
          \n    missing = [k for k in KEYS if not known(k)]\n    reasons = []\n  \
          \  if known(\"onboarding_owner\") and not re.search(r\"接应|对接|答疑|入门支持|带领.{0,8}上手|帮助.{0,8}上手\"\
          , fields[\"onboarding_owner\"][\"quote\"]):\n        missing.append(\"onboarding_owner\"\
          )\n        fields[\"onboarding_owner\"] = {\"value\":\"\",\"status\":\"\
          unknown\",\"quote\":\"\",\"source\":\"not_provided\",\"verification\":\"\
          not_provided\"}\n        reasons.append(\"尚未明确谁承担接应和对接，验收人不能自动代替接应人。\")\n\
          \    readiness = \"unknown\"\n    if known(\"execution_readiness\"):\n \
          \       value = fields[\"execution_readiness\"][\"value\"]\n        quotes\
          \ = \"；\".join(fields[k][\"quote\"] for k in [\"input_materials\",\"dependencies\"\
          ,\"execution_readiness\"] if known(k))\n        if re.search(r\"不可用|无法提供|不能提供|无法获得|无法取得\"\
          , quotes):\n            readiness = \"blocked\"\n        elif re.search(r\"\
          尚未|还未|未就绪|未到位|未落实|未获|未借到|待落实|待授权|待审批|待申请|申请中|审批中|等待|预计.{0,12}(?:借到|获得|取得|拿到)\"\
          , quotes):\n            readiness = \"pending\"\n        elif value == \"\
