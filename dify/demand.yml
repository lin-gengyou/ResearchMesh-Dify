          , \"状态：需要补充；本轮最多追问3项。\", *base, \"## 本轮优先补充\"]\n        body += [str(i+1)\
          \ + \". \" + q + \"\\n   用途：\" + reason for i, (q, reason) in enumerate(shown)]\n\
          \        body += [\"## 全部待补条件\", \"、\".join(LABELS.get(k, {\"need_type\"\
          :\"合作方式\",\"existing_team\":\"已说明的成员能力\",\"project_stage\":\"当前进度\",\"requirements\"\
          :\"能力要求（必须性及独立程度）\",\"learning_support\":\"学习/指导支持\"}.get(k,k)) for k in\
          \ missing), \"上方列出本次输入中通过原文检查的信息；AI建议不算已确认事实。\", \"本版没有跨次自动记忆。请在补充说明栏填写新增信息，保留原始需求和此前仍有效的补充，再次运行；系统会重新检查全部信息。\"\
          ]\n        if notes: body += [\"## 负责人核对提示\", \"\\n\".join(\"- \" + x for\
          \ x in notes[:8])]\n        body += [\"未发布需求，未进行匹配。\"]\n        empty[\"\
          clarification\"] = \"\\n\\n\".join(body)\n        return empty\n    body\
          \ = [\"# 研织 ResearchMesh｜负责人审核稿\", \"状态：基础信息、执行条件和能力要求已齐备，可以进入人工审核。尚未由负责人确认。\"\
          , *base]\n    for k, label in [(\"existing_team\", \"原文说明的成员能力\"), (\"project_stage\"\
          , \"当前进度\")]:\n        if known(k): body += [\"## \" + label, fields[k][\"\
          value\"]]\n    gaps = [g[\"skill\"] for g in p.get(\"capability_gaps\",\
          \ []) if isinstance(g, dict) and g.get(\"assessment\") == \"explicit_gap\"\
          \ and isinstance(g.get(\"skill\"), str)]\n    if gaps: body += [\"## 原文提出的能力需求\"\
          , \"、\".join(gaps)]\n    body += [\"## 负责人下一步核对\", \"请核对职责、首次交付、验收、时间、接应及输入/依赖安排。执行条件已就绪仅代表当前资料的声明，尚未独立核实资源和权限；原文声明也不等于技术能力认证。\"\
          ]\n    if notes: body += [\"## 需要人工审核的提示\", \"\\n\".join(\"- \" + x for\
          \ x in notes[:8])]\n    body += [\"本节点只完成资料完整性分流，不执行人工确认；未发布需求，未匹配、未联系任何人。\"\
          ]\n    return {\"route\":\"review\", \"clarification\":\"\", \"review\"\
          :\"\\n\\n\".join(body)}\n"
