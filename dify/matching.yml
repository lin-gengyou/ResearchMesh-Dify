          \            r=byid[c[\"requirement_id\"]]\n            lines+=[\"\",\"\
          **\"+(\"必需\" if r[\"must\"] else \"可选\")+\"：\"+safe(r[\"text\"])+\"**\"\
          ,\n               \"判断：\"+label[c[\"effective\"]]+\"。\"+safe(c[\"reason\"\
          ])]\n            if c[\"quote\"]:lines+=[\"依据 [\"+safe(c[\"evidence_id\"\
          ])+\"]：“\"+safe(c[\"quote\"])+\"”\"]\n        if p[\"pending\"]:lines+=[\"\
          待确认条件：\"+\"；\".join(safe(x) for x in p[\"pending\"])]\n        if p[\"must_gaps\"\
          ]:lines+=[\"未覆盖的必需项：\"+\"；\".join(safe(x) for x in p[\"must_gaps\"]),\"\
          下一步：先核对相关个人工作或用有限试任务补充判断，不直接确认能承担。\"]\n        elif p[\"pending\"]:lines+=[\"\
          下一步：先确认上述时间或意愿，再由双方决定是否进行有限讨论。\"]\n        else:lines+=[\"下一步：双方复核任务范围、材料和时间，再决定是否试协作。\"\
          ]\n    if d[\"excluded\"]:\n        lines+=[\"\",\"## 本轮未进入AI评估\"]\n   \
          \     lines += [safe(p[\"name\"])+\"：\"+ \"；\".join(safe(x) for x in p[\"\
