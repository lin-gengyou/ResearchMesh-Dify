          ])]\n        lines += [\"\", \"## 已核对材料与任务缺口\"]\n    for n,p in enumerate(rows,1):\n\
          \        ct=p[\"counts\"]\n        lines+=[\"\",\"## \"+str(n)+\". \"+safe(p[\"\
