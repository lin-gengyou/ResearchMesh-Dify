          effective\"]==k for c in cells) for k in label}\n        state=\"需补足必需项\"\
          \ if gaps else (\"合作条件待确认\" if p[\"pending\"] else \"可优先进行有限讨论\")\n    \
          \    rows.append({**p,\"cells\":cells,\"must_gaps\":gaps,\"counts\":counts,\"\
