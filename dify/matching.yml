          , \"## 可探索的经历线索\", \"以下经历与任务可能相关，但尚未满足已核对材料或任务范围条件。可先讨论做法，不代表能直接承担。\"]\n\
          \        for candidate in exploration:\n            lines += [\"\", \"###\
          \ \"+safe(candidate[\"name\"])]\n            for clue in candidate[\"clues\"\
          ]:\n                lines += [\"相关任务：\"+safe(clue[\"task\"]),\"AI关联理由：\"\
          +safe(clue[\"why_relevant\"]),\"原文依据：“\"+safe(clue[\"quote\"])+\"”\", \"\
          仍待核对：\"+safe(clue[\"unresolved\"])]\n                if clue.get(\"independence_gap\"\
          ):lines += [safe(clue[\"independence_gap\"])]\n                probe=clue.get(\"\
          probe\")\n                if probe:\n                    lines += [\"可选讨论草稿（约\"\
          +str(probe[\"minutes\"])+\"分钟）：\"+safe(probe[\"goal\"])]\n             \
          \       lines += [str(i+1)+\". \"+safe(step) for i,step in enumerate(probe[\"\
          steps\"])]\n                    lines += [\"核对点：\"+safe(probe[\"success_check\"\
          ]),\"仅使用模拟或脱敏样例；可拒绝或停止，不计项目交付、评分或能力认证。\"]\n            if candidate[\"pending_conditions\"\
