          \          '必需项指本次要完成的任务；是否必须已有技能、能否边做边学与指导支持另行保留。材料暂不支持不等于不允许学习。进入组队前须重查需求当前版本。']\n\
          \        support=d['need'].get('learning_support') or {}\n        if support.get('description'):lines\
