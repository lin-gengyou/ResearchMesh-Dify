            {"assessments":[{"candidate_id":"已有候选ID","requirement_id":"已有要求ID","relation":"direct|adjacent|unsupported|unknown","evidence_id":"该候选已有证据ID，找不到则空","quote":"证据text内连续原文片段，找不到则空","reason":"简短解释这个片段如何支持或不足以支持这项任务"}]}

