            adjacent：有可解释的相邻经验，但需要适应；ESP32经验不直接等于STM32，Fusion不直接等于SolidWorks，串口/UART可视上下文对齐。只说相邻，不冒充已有能力。

            unsupported：材料明确说明没做过、不具备或该工作由他人完成；无记录不代表不具备，不可当不支持。

            unknown：材料不足、仅兴趣、缺少本人工作范围或无法确定。

