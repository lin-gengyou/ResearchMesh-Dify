    - data:
        code: "\"\"\"Reference bridge; current/confirmation must be supplied by an\
          \ authenticated backend.\n\nThese comparisons detect inconsistent snapshots,\
          \ not forged client requests.\nNo identity authentication, state storage,\
          \ contact, or publication occurs here.\n\"\"\"\nimport copy\nimport datetime\n\
          import hashlib\nimport json\nimport math\nimport re\n\nclass BridgeError(ValueError):\n\
          \    pass\n\nNORMALIZED_KEYS = ('id','title','owner_id','need_version','hours_per_week','start_date','expires_date','location','requirements')\n\
          \ndef digest(value):\n    return hashlib.sha256(json.dumps(value, ensure_ascii=False,\
          \ sort_keys=True, separators=(',', ':')).encode()).hexdigest()\n\ndef valid_text(value,\
          \ limit=160):\n    return isinstance(value, str) and bool(value.strip())\
          \ and len(value) <= limit\n\ndef task_text(value):\n    return re.sub(r'[\\\
          s，,；;。]+', '', value)\n\ndef task_proposal(handoff):\n    \"\"\"AI already\
          \ extracts the task; this only separates its explicit clauses.\"\"\"\n \
          \   s = handoff.get('reviewed_snapshot', {})\n    f = s.get('fields', {}).get('task',\
          \ {})\n    if f.get('status') != 'explicit' or not valid_text(f.get('value'),\
          \ 3000):\n        raise BridgeError('缺少AI提取且已审核的具体职责')\n    parts = [x.strip()\
          \ for x in re.split(r'[，；;\\n]+', f['value']) if x.strip()]\n    if not\
          \ 1 <= len(parts) <= 6 or any(len(x) > 500 for x in parts):\n        raise\
          \ BridgeError('任务需明确整理为1至6项；未静默截断')\n    return [{'id': 'R'+str(i+1), 'text':\
          \ x, 'source_quote': x} for i,x in enumerate(parts)]\n\ndef prepare_review_need(handoff,\
          \ confirmation, current):\n    if not all(isinstance(x, dict) for x in (handoff,\
          \ confirmation, current)):\n        raise BridgeError('缺少审核交接、规范化确认或当前状态')\n\
          \    if handoff.get('schema_version') != 'need_matching_handoff_0.1' or\
          \ handoff.get('route') != 'await_backend_confirmation' or handoff.get('review_status')\
          \ != 'human_confirmed_in_demo':\n        raise BridgeError('需求尚未通过本次审核')\n\
          \    snapshot = handoff.get('reviewed_snapshot')\n    source_hash = handoff.get('source_draft_sha256')\n\
          \    run_id = handoff.get('source_workflow_run_id')\n    if not isinstance(snapshot,\
          \ dict) or not valid_text(run_id, 160) or source_hash != digest(snapshot):\n\
          \        raise BridgeError('所审内容与来源指纹不一致')\n    if snapshot.get('execution_checks',\
          \ {}).get('ready_for_owner_review') is not True or snapshot.get('requirements_checks',\
