          ]):c for c in d[\"matrix\"]}\n    def safe(x):return str(x or \"\").replace(\"\
          \\n\",\" \").replace(\"|\",\"／\")[:1600]\n    options={}\n    for r in reqs:\n\
          \        options[r[\"id\"]]=[pid for pid,p in people.items() if p[\"hours_per_week\"\
          ]>=r[\"hours\"] and matrix[(pid,r[\"id\"])][\"effective\"] in [\"direct\"\
          ,\"adjacent\"]]\n    missing=[r for r in reqs if r[\"must\"] and not options[r[\"\
          id\"]]]\n    ordered=sorted(reqs,key=lambda r:(not r[\"must\"],len(options[r[\"\
          id\"]]),-r[\"hours\"],r[\"id\"]))\n    best={}; visits=0; complete=True\n\
          \    def quality(plan):\n        return (plan[\"optional_covered\"],plan[\"\
          direct_count\"],-plan[\"adjacent_count\"],-plan[\"max_utilization\"])\n\
          \    def walk(i,loads,assignments):\n        nonlocal visits,complete\n\
          \        visits+=1\n        if visits>250000:complete=False;return\n   \
          \     if i==len(ordered):\n            ids=tuple(sorted(loads))\n      \
          \      if not ids:return\n            cs=[people[x] for x in ids]\n    \
          \        plan={\"member_ids\":list(ids),\"assignments\":list(assignments),\"\
          loads\":dict(loads),\n                \"new_people\":sum(not p[\"existing_member\"\
          ] for p in cs),\"team_size\":len(ids),\n                \"pending_count\"\
          :sum(bool(p[\"pending\"]) for p in cs),\n                \"optional_covered\"\
          :sum(not next(r for r in reqs if r[\"id\"]==a[\"task_id\"])[\"must\"] for\
          \ a in assignments),\n                \"direct_count\":sum(a[\"support\"\
          ]==\"direct\" for a in assignments),\n                \"adjacent_count\"\
          :sum(a[\"support\"]==\"adjacent\" for a in assignments),\n             \
          \   \"max_utilization\":max(loads[x]/people[x][\"hours_per_week\"] for x\
          \ in ids)}\n            if ids not in best or quality(plan)>quality(best[ids]):best[ids]=plan\n\
          \            return\n        r=ordered[i]\n        for pid in options[r[\"\
          id\"]]:\n            current=loads.get(pid,0); total=current+r[\"hours\"\
          ]\n            if total>people[pid][\"hours_per_week\"]+1e-9:continue\n\
          \            if pid not in loads and len(loads)>=need[\"max_people\"]:continue\n\
          \            cell=matrix[(pid,r[\"id\"])]\n            loads[pid]=total\n\
          \            assignments.append({\"task_id\":r[\"id\"],\"person_id\":pid,\"\
          hours\":r[\"hours\"],\"support\":cell[\"effective\"],\"evidence_id\":cell[\"\
          evidence_id\"],\"quote\":cell[\"quote\"]})\n            walk(i+1,loads,assignments)\n\
          \            assignments.pop()\n            if current:loads[pid]=current\n\
          \            else:loads.pop(pid,None)\n            if not complete:return\n\
          \        if not r[\"must\"]:walk(i+1,loads,assignments)\n    if not missing:walk(0,{},[])\n\
          \    allplans=list(best.values())\n    def metrics(p):return (p[\"pending_count\"\
          ],p[\"new_people\"],p[\"team_size\"],-p[\"optional_covered\"],-p[\"direct_count\"\
          ],p[\"adjacent_count\"])\n    def dominates(a,b):\n        av=metrics(a);bv=metrics(b)\n\
          \        return all(x<=y for x,y in zip(av,bv)) and any(x<y for x,y in zip(av,bv))\n\
          \    frontier=[p for p in allplans if not any(dominates(q,p) for q in allplans)]\n\
          \    frontier.sort(key=lambda p:(p[\"pending_count\"],p[\"new_people\"],-p[\"\
          optional_covered\"],-p[\"direct_count\"],p[\"team_size\"],p[\"adjacent_count\"\
