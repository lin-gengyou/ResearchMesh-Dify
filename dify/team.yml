          ,\"identity_verified\":False,\"auto_create_team\":False,\"auto_contact\"\
          :False}\n    lines=[\"# 研织｜组队组合与工时分配（演示）\",\"目标：\"+safe(need.get(\"title\"\
          ) or need.get(\"id\")),\n      \"按同一周工时计算，每项任务只分配一名主责人；可以一人承担多项，但累计不得超出其可用工时。参与分配人数最多\
          \ \"+str(need[\"max_people\"])+\" 人。\",\n      \"已有成员优先用于减少新增招募；先满足全部必需项，再比较材料支持、人数、可选项与适应成本。不直接拼个人排行榜。\"\
          ]\n    if not chosen:\n        lines+=[\"\",\"## 当前没有可行的完整分工\"]\n      \
          \  if missing:lines+=[\"缺少足够个人证据或单项可用工时的必需任务：\"]+[safe(r[\"text\"])+\"（本周\
          \ \"+str(r[\"hours\"])+\" 小时）\" for r in missing]\n        elif complete:lines+=[\"\
          每项必需任务单独都有人可承担，但同时分配时触发累计工时或人数上限；不能把同一人的空闲时间重复使用。\"]\n        else:lines+=[\"\
          搜索达到本版计算上限，尚不能宣称没有可行方案。\"]\n        lines+=[\"下一步：核对个人任务范围，调整任务工时或人数边界，或补充真正覆盖缺口的候选；系统没有代人承诺。\"\
          ]\n    for n,p in enumerate(chosen,1):\n        names=\"、\".join(safe(people[x][\"\
          name\"]) for x in p[\"member_ids\"])\n        lines+=[\"\",\"## 方案 \"+str(n)+\"\
          ：\"+names,\n          \"参与 \"+str(p[\"team_size\"])+\" 人；其中新增 \"+str(p[\"\
          new_people\"])+\" 人；直接支持 \"+str(p[\"direct_count\"])+\" 项，相邻经验 \"+str(p[\"\
          adjacent_count\"])+\" 项，可选任务覆盖 \"+str(p[\"optional_covered\"])+\" 项。\"]\n\
          \        for pid in p[\"member_ids\"]:\n            person=people[pid];\
          \ mine=[a for a in p[\"assignments\"] if a[\"person_id\"]==pid]\n      \
          \      lines+=[\"\",\"**\"+safe(person[\"name\"])+\"（\"+(\"已有成员\" if person[\"\
          existing_member\"] else \"候选新增成员\")+\"）**\",\n                \"本周拟分配 \"\
          +str(round(p[\"loads\"][pid],3))+\" / 可用 \"+str(person[\"hours_per_week\"\
          ])+\" 小时，余量 \"+str(round(person[\"hours_per_week\"]-p[\"loads\"][pid],3))+\"\
          \ 小时。\"]\n            for a in mine:\n                r=next(r for r in\
          \ reqs if r[\"id\"]==a[\"task_id\"])\n                lines += [\"任务：\"\
          +safe(r[\"text\"])+\"；\"+str(a[\"hours\"])+\" 小时；\"+(\"直接支持\" if a[\"support\"\
          ]==\"direct\" else \"相邻经验，需适应\")+\"。\",\n                  \"依据 [\"+safe(a[\"\
          evidence_id\"])+\"]：“\"+safe(a[\"quote\"])+\"”\"]\n            if person[\"\
          pending\"]:lines+=[\"待确认：\"+\"；\".join(safe(x) for x in person[\"pending\"\
          ])]\n        unassigned=[r[\"text\"] for r in reqs if not r[\"must\"] and\
          \ r[\"id\"] not in [a[\"task_id\"] for a in p[\"assignments\"]]]\n     \
          \   if unassigned:lines+=[\"尚未安排的可选任务：\"+\"；\".join(safe(x) for x in unassigned)]\n\
          \        lines+=[\"方案状态：\"+(\"有人意愿或条件待确认，不能直接发起组队。\" if p[\"pending_count\"\
          ] else \"可供相关人复核分工，尚未形成团队。\")]\n    if chosen:lines+=[\"\",\"对满足必需项的 \"\
          +str(len(best))+\" 个可行成员集合进行比较，展示最多3个在人数、新增成员、覆盖与适应成本上不被明显支配的方案；不为凑数增加团队成员。\"\
          ]\n    if not complete:lines+=[\"计算提示：搜索未完成，当前方案只代表已检查部分，不宣称全局最优。\"]\n \
          \   if d[\"excluded\"]:lines+=[\"\",\"## 本轮未参与分配\"]+[safe(p[\"name\"])+\"\
          ：\"+ \"；\".join(safe(x) for x in p[\"reasons\"]) for p in d[\"excluded\"\
          ]]\n    if d[\"warnings\"]:lines+=[\"\",\"校验提示：\"+\"；\".join(safe(x) for\
          \ x in d[\"warnings\"])]\n    lines+=[\"\",\"边界：工时和确认标记来自输入数据包，未核验身份或具体日程交集；不处理任务拆分、复杂并行依赖或真实名额锁定。方案需本人和负责人复核；不会自动联系、邀请或建立团队。\"\
          ]\n    return {\"result\":\"\\n\".join(lines),\"payload\":json.dumps(payload,ensure_ascii=False)}\n"
