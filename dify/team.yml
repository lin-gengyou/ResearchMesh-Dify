          : p[\"terms_hash\"],\n                              \"confirmations\": copy.deepcopy(p[\"\
          confirmations\"]), \"state\": p[\"state\"]})\n        p[\"version\"] +=\
          \ 1\n        p[\"confirmations\"] = {}\n        p[\"revision_request\"]\
          \ = changes\n        p[\"state\"] = \"revision_required\"\n        return\
          \ seal(p)\n    p[\"confirmations\"][role] = {\"choice\": effective, \"actor_id_from_input\"\
          : actor_id,\n                                \"version\": p[\"version\"\
          ], \"terms_hash\": p[\"terms_hash\"],\n                                \"\
          identity_verified\": False, \"event_id\": event_id}\n    if effective ==\
          \ \"decline\":\n        p[\"state\"] = \"declined\"\n    else:\n       \
