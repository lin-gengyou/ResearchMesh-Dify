app:
  description: 同一周任务与候选数据包→授权/状态/场地检查→AI理解个人经历与每项任务→证据校验→回溯分配主责人与工时→比较最多3个不被明显支配的组合。按人累计工时，先考虑已有成员，避免把个人Top3直接拼成团队；无可行方案时指出能力或工时/人数冲突。本版最多10人6项任务、参与分配最多3人，每项一名主责，不处理复杂并行依赖。仅演示，不自动邀请或建队，确认标记来自输入数据，未做身份核验。
