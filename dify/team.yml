        code: "\"\"\"ResearchMesh versioned agreement domain logic; demo identities,\
          \ no database writes.\"\"\"\nimport copy\nimport datetime as dt\nimport\
          \ hashlib\nimport json\nimport re\n\n\nclass AgreementError(ValueError):\n\
          \    pass\n\n\ndef canonical(value):\n    return json.dumps(value, ensure_ascii=False,\
          \ sort_keys=True, separators=(\",\", \":\"))\n\n\ndef digest(value):\n \
