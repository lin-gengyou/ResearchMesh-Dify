        code: "\"\"\"ResearchMesh versioned agreement domain logic; demo identities,\
          \ no database writes.\"\"\"\nimport copy\nimport datetime as dt\nimport\
          \ hashlib\nimport json\nimport re\n\n\nclass AgreementError(ValueError):\n\
          \    pass\n\n\ndef canonical(value):\n    return json.dumps(value, ensure_ascii=False,\
          \ sort_keys=True, separators=(\",\", \":\"))\n\n\ndef digest(value):\n \
          \   return hashlib.sha256(canonical(value).encode()).hexdigest()\n\n\ndef\
          \ now():\n    return dt.datetime.now(dt.timezone.utc).isoformat()\n\n\n\
          def text(value, limit=3000):\n    if not isinstance(value, str) or len(value)\
          \ > limit:\n        raise AgreementError(\"字段必须为长度受限的文本\")\n    return value.strip()\n\
          \n\ndef number(value):\n    return isinstance(value, (float, int)) and not\
          \ isinstance(value, bool) and 0 < value <= 168\n\n\ndef extract_field(raw,\
          \ source, proposal=True):\n    \"\"\"Only an exact quotation plus literal\
          \ value supports a source claim.\"\"\"\n    if not isinstance(raw, dict):\n\
          \        return {\"value\": \"\", \"basis\": \"unknown\", \"quote\": \"\"\
          }\n    value = text(raw.get(\"value\", \"\"))\n    quote = text(raw.get(\"\
          quote\", \"\"), 12000)\n    basis = raw.get(\"basis\")\n    if value and\
          \ basis == \"source\" and quote and quote in source and value in quote:\n\
          \        return {\"value\": value, \"basis\": \"source\", \"quote\": quote}\n\
          \    if value and basis == \"proposal\" and proposal:\n        return {\"\
          value\": value, \"basis\": \"proposal\", \"quote\": \"\"}\n    return {\"\
          value\": \"\", \"basis\": \"unknown\", \"quote\": \"\"}\n\n\ndef material(packet):\n\
          \    return {k: packet[k] for k in (\n        \"agreement_id\", \"version\"\
          , \"need_id\", \"need_version\", \"owner_id\",\n        \"performer_id\"\
          , \"terms\", \"revision_request\"\n    )}\n\n\ndef seal(packet):\n    packet[\"\
          terms_hash\"] = digest(material(packet))\n    return packet\n\n\ndef check(packet):\n\
          \    if packet.get(\"terms_hash\") != digest(material(packet)):\n      \
          \  raise AgreementError(\"约定内容与快照不符，请重新读取当前版本\")\n\n\ndef blockers(packet):\n\
          \    reasons = []\n    if packet[\"revision_request\"]:\n        reasons.append(\"\
          修改尚未整理成新版本\")\n    if packet.get(\"revision_errors\"):\n        reasons.extend(packet[\"\
          revision_errors\"])\n    for item in packet[\"terms\"][\"deliverables\"\
          ]:\n        if not item[\"acceptance\"][\"value\"]:\n            reasons.append(item[\"\
          id\"] + \"尚未约定验收方式\")\n    return reasons\n\n\ndef build_draft(context,\
          \ model, version=1):\n    \"\"\"Context is selected-plan data supplied by\
          \ the caller, never identity proof.\"\"\"\n    c = copy.deepcopy(context)\n\
          \    for key in [\"agreement_id\", \"need_id\", \"owner_id\", \"performer_id\"\
          ]:\n        c[key] = text(c.get(key, \"\"), 120)\n        if not c[key]:\n\
          \            raise AgreementError(\"缺少约定、需求或参与者标识\")\n    if c[\"owner_id\"\
          ] == c[\"performer_id\"]:\n        raise AgreementError(\"两种角色不能使用同一参与者标识\"\
          )\n    if type(c.get(\"need_version\")) is not int or c[\"need_version\"\
          ] < 1:\n        raise AgreementError(\"缺少有效需求版本\")\n    if type(version)\
          \ is not int or version < 1:\n        raise AgreementError(\"无效约定版本\")\n\
          \    source = text(c.get(\"source_text\", \"\"), 18000)\n    tasks = c.get(\"\
          tasks\")\n    if not isinstance(tasks, list) or not 1 <= len(tasks) <= 6:\n\
          \        raise AgreementError(\"每份约定应有1至6项本人任务\")\n    ids = []\n    total\
          \ = 0\n    for task in tasks:\n        task[\"id\"] = text(task.get(\"id\"\
          , \"\"), 80)\n        task[\"text\"] = text(task.get(\"text\", \"\"), 1000)\n\
          \        if not task[\"id\"] or task[\"id\"] in ids or not task[\"text\"\
          ] or not number(task.get(\"hours\")):\n            raise AgreementError(\"\
          任务标识、本人职责或工时无效\")\n        ids.append(task[\"id\"])\n        total += task[\"\
          hours\"]\n    budget = c.get(\"available_hours\")\n    if not number(budget)\
          \ or total > budget:\n        raise AgreementError(\"同一合作时段的工时预算未明确或已超出\"\
          )\n    if not isinstance(model, dict):\n        model = {}\n    generated\
          \ = model.get(\"deliverables\", [])\n    if not isinstance(generated, list):\n\
          \        generated = []\n    deliverables = []\n    for task in tasks:\n\
          \        matches = [x for x in generated if isinstance(x, dict) and x.get(\"\
          id\") == task[\"id\"]]\n        raw = matches[0] if len(matches) == 1 else\
          \ {}\n        deliverables.append({\"id\": task[\"id\"], \"text\": task[\"\
          text\"], \"hours\": task[\"hours\"],\n                             \"acceptance\"\
          : extract_field(raw.get(\"acceptance\"), source)})\n    terms = {\"deliverables\"\
          : deliverables, \"total_hours\": total,\n             \"time_window\": text(c.get(\"\
          time_window\", \"\"), 200),\n             \"due\": extract_field(model.get(\"\
          due\"), source, proposal=False),\n             \"inputs\": extract_field(model.get(\"\
          inputs\"), source),\n             \"support\": extract_field(model.get(\"\
          support\"), source, proposal=False),\n             \"reward\": extract_field(model.get(\"\
          reward\"), source, proposal=False),\n             \"withdrawal\": extract_field(model.get(\"\
          withdrawal\"), source),\n             \"public_contribution\": \"交付验收后仍由贡献者本人另行授权，默认不公开\"\
          }\n    if not terms[\"time_window\"]:\n        raise AgreementError(\"必须标明任务与可用工时所属的同一时间段\"\
          )\n    questions = []\n    if not terms[\"due\"][\"value\"]:\n        questions.append(\"\
          希望何时交付？也可以明确约定无固定截止日期。\")\n    missing = [x[\"text\"] for x in deliverables\
          \ if not x[\"acceptance\"][\"value\"]]\n    if missing:\n        questions.append(\"\
          这些交付怎么判断完成：\" + \"、\".join(missing))\n    packet = {\"schema_version\":\
          \ 1, \"agreement_id\": c[\"agreement_id\"], \"version\": version,\n    \
          \          \"need_id\": c[\"need_id\"], \"need_version\": c[\"need_version\"\
