          , \"revise\", \"decline\"]:\n        raise AgreementError(\"无效操作\")\n  \
          \  changes = text(requested_changes)\n    note = text(note)\n    event_id\
          \ = text(event_id, 160)\n    if not event_id:\n        raise AgreementError(\"\
          操作缺少幂等标识\")\n    request_hash = digest({\"role\": role, \"actor_id\": actor_id,\
          \ \"action\": action,\n                           \"version\": expected_version,\
          \ \"hash\": expected_hash,\n                           \"changes\": changes,\
          \ \"note\": note})\n    for event in p[\"events\"]:\n        if event[\"\
          id\"] == event_id:\n            if event[\"request_hash\"] != request_hash:\n\
          \                raise AgreementError(\"同一操作标识不能复用到不同选择\")\n           \
          \ return p\n    if expected_version != p[\"version\"] or expected_hash !=\
          \ p[\"terms_hash\"]:\n        raise AgreementError(\"你看到的约定已过期，请重新查看并确认\"\
          )\n    if p[\"state\"] == \"declined\":\n        raise AgreementError(\"\
          当前约定已被拒绝，不能继续确认\")\n    if p[\"revision_request\"]:\n        raise AgreementError(\"\
          修改尚未整理完成，双方均需等待新草稿\")\n    if action == \"revise\" and not changes:\n  \
          \      raise AgreementError(\"请说明需要修改的内容\")\n    # Nonempty change requests\
          \ always override an accept click.\n    effective = \"decline\" if action\
          \ == \"decline\" else \"revise\" if changes else action\n    if effective\
          \ == \"accept\" and blockers(p):\n        raise AgreementError(\"；\".join(blockers(p)))\n\
          \    event = {\"id\": event_id, \"role\": role, \"actor_id_from_input\"\
          : actor_id,\n             \"identity_verified\": False, \"requested_action\"\
          : action,\n             \"effective_action\": effective, \"version\": p[\"\
          version\"],\n             \"terms_hash\": p[\"terms_hash\"], \"requested_changes\"\
          : changes,\n             \"note\": note, \"at\": now(), \"request_hash\"\
          : request_hash}\n    p[\"events\"].append(event)\n    if effective == \"\
